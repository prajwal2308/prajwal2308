<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Prajwal Srinivas — Software, Cloud and DevOps, AI Engineering">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#080B11"/><stop offset="55%" stop-color="#0B111B"/><stop offset="100%" stop-color="#070A0F"/>
  </linearGradient>
  <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#7FB2E8" stop-opacity=".45"/><stop offset="100%" stop-color="#7FB2E8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#E8B98A" stop-opacity=".3"/><stop offset="100%" stop-color="#E8B98A" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#EDEAE4"/><stop offset="42%" stop-color="#BCD6F2"/>
    <stop offset="72%" stop-color="#E8B98A"/><stop offset="100%" stop-color="#EDEAE4"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="14s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7FB2E8" stop-opacity="0"/><stop offset="50%" stop-color="#7FB2E8" stop-opacity=".55"/><stop offset="100%" stop-color="#7FB2E8" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M44 0H0V44" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/>
  </pattern>
  <style>
    .mono{font-family:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace}
    .sans{font-family:system-ui,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
    .pk{animation:run 4.4s linear infinite}
    .pk2{animation:run 4.4s linear infinite;animation-delay:-1.5s}
    .pk3{animation:run 4.4s linear infinite;animation-delay:-3s}
    @keyframes run{0%{transform:translateX(0);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translateX(560px);opacity:0}}
    .brt{animation:brt 3.6s ease-in-out infinite}
    @keyframes brt{0%,100%{opacity:.35}50%{opacity:.9}}
    .fade{opacity:0;animation:fade .9s ease-out forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.28s}.d3{animation-delay:.46s}.d4{animation-delay:.64s}
    @keyframes fade{to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.pk,.pk2,.pk3,.brt,.fade{animation:none}.fade{opacity:1}}
  </style>
</defs>

<rect width="1200" height="380" fill="url(#sky)"/>
<rect width="1200" height="380" fill="url(#grid)"/>
<ellipse cx="215" cy="120" rx="330" ry="240" fill="url(#glowA)"/>
<ellipse cx="1010" cy="300" rx="300" ry="220" fill="url(#glowB)"/>

<!-- the layer in the middle -->
<g transform="translate(0,258)">
  <line x1="60" y1="0" x2="1140" y2="0" stroke="url(#wire)" stroke-width="1"/>
  <g class="brt">
    <rect x="472" y="-19" width="256" height="38" rx="6" fill="#0C1420" stroke="#7FB2E8" stroke-opacity=".45"/>
    <text class="mono" x="600" y="5" text-anchor="middle" font-size="11" letter-spacing="3.4" fill="#9FC4EA">CONTROL PLANE</text>
  </g>
  <g fill="#7FB2E8"><circle class="pk"  cx="70" cy="0" r="3.4"/><circle class="pk2" cx="70" cy="0" r="3.4"/><circle class="pk3" cx="70" cy="0" r="2.6" fill="#E8B98A"/></g>
  <text class="mono" x="60"   y="30" font-size="9.5" letter-spacing="2.6" fill="#5D6878">YOUR APP</text>
  <text class="mono" x="1140" y="30" font-size="9.5" letter-spacing="2.6" fill="#5D6878" text-anchor="end">SIX PROVIDERS</text>
  <text class="mono" x="600"  y="46" font-size="9.5" letter-spacing="2.2" fill="#4E5866" text-anchor="middle">GUARDRAIL · ROUTE · TELEMETRY · FAILOVER · REDACT</text>
</g>

<g transform="translate(60,0)">
  <text class="mono fade d1" x="2" y="88" font-size="11" letter-spacing="5.2" fill="#7FB2E8">OPEN TO WORK</text>
  <text class="sans fade d2" x="0" y="176" font-size="76" font-weight="800" letter-spacing="-3.6" fill="url(#name)">PRAJWAL SRINIVAS</text>
  <text class="mono fade d3" x="2" y="207" font-size="13" letter-spacing="4.6" fill="#98A3B4">SOFTWARE  ·  CLOUD &amp; DEVOPS  ·  AI ENGINEERING</text>
  <text class="sans fade d4" x="2" y="232" font-size="13.5" fill="#6B7686">MS Computer Science, Rutgers  ·  United States, will relocate  ·  F-1 OPT (STEM)</text>
</g>
</svg>
