<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Prajwal Srinivas — Software, Cloud and DevOps, AI Engineering. Five things shipped in twelve months.">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#080B11"/><stop offset="55%" stop-color="#0B111B"/><stop offset="100%" stop-color="#070A0F"/>
  </linearGradient>
  <radialGradient id="gA" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7FB2E8" stop-opacity=".42"/><stop offset="100%" stop-color="#7FB2E8" stop-opacity="0"/></radialGradient>
  <radialGradient id="gB" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#E8B98A" stop-opacity=".28"/><stop offset="100%" stop-color="#E8B98A" stop-opacity="0"/></radialGradient>
  <radialGradient id="gC" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6FBE86" stop-opacity=".2"/><stop offset="100%" stop-color="#6FBE86" stop-opacity="0"/></radialGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#EDEAE4"/><stop offset="42%" stop-color="#BCD6F2"/>
    <stop offset="72%" stop-color="#E8B98A"/><stop offset="100%" stop-color="#EDEAE4"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="16s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
    <path d="M44 0H0V44" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/>
  </pattern>
  <style>
    .mono{font-family:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace}
    .sans{font-family:system-ui,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
    .up{opacity:0;animation:up .85s cubic-bezier(.23,1,.32,1) forwards}
    .u1{animation-delay:.05s}.u2{animation-delay:.2s}.u3{animation-delay:.35s}.u4{animation-delay:.5s}
    .c1{animation-delay:.66s}.c2{animation-delay:.76s}.c3{animation-delay:.86s}.c4{animation-delay:.96s}.c5{animation-delay:1.06s}
    @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .lamp{animation:lamp 9s ease-in-out infinite}
    @keyframes lamp{0%,100%{opacity:.18}50%{opacity:.6}}
    .l2{animation-delay:-1.8s}.l3{animation-delay:-3.6s}.l4{animation-delay:-5.4s}.l5{animation-delay:-7.2s}
    @media (prefers-reduced-motion:reduce){.up,.lamp{animation:none}.up{opacity:1}}
  </style>
</defs>

<rect width="1200" height="380" fill="url(#sky)"/>
<rect width="1200" height="380" fill="url(#grid)"/>
<ellipse cx="180" cy="90" rx="330" ry="230" fill="url(#gA)"/>
<ellipse cx="1030" cy="300" rx="300" ry="215" fill="url(#gB)"/>
<ellipse cx="640" cy="40"  rx="260" ry="170" fill="url(#gC)"/>

<g transform="translate(60,0)">
  <text class="mono up u1" x="2" y="86" font-size="11" letter-spacing="5.2" fill="#7FB2E8">OPEN TO WORK</text>
  <text class="sans up u2" x="0" y="172" font-size="76" font-weight="800" letter-spacing="-3.6" fill="url(#name)">PRAJWAL SRINIVAS</text>
  <text class="mono up u3" x="2" y="203" font-size="13" letter-spacing="4.6" fill="#98A3B4">SOFTWARE  ·  CLOUD &amp; DEVOPS  ·  AI ENGINEERING</text>
  <text class="sans up u4" x="2" y="229" font-size="13.5" fill="#6B7686">MS Computer Science, Rutgers  ·  United States, will relocate  ·  F-1 OPT (STEM)</text>
</g>

<!-- five different kinds of thing, shipped in twelve months -->
<g transform="translate(60,268)">
  <text class="mono up u4" x="2" y="0" font-size="9.5" letter-spacing="3.2" fill="#4E5866">SHIPPED IN THE LAST TWELVE MONTHS</text>
  <g class="mono" font-size="10">
    <g class="up c1"><rect class="lamp"    x="0"   y="14" width="204" height="48" rx="6" fill="#7FB2E8" fill-opacity=".07"/><rect x="0" y="14" width="204" height="48" rx="6" fill="none" stroke="#FFFFFF" stroke-opacity=".11"/>
      <text x="14" y="34" letter-spacing="2.4" fill="#7FB2E8">A NATIVE APP</text><text x="14" y="51" fill="#79839460" font-size="10.5" letter-spacing=".3" fill-opacity=".75">Swift · SwiftUI · macOS</text></g>
    <g class="up c2"><rect class="lamp l2" x="220" y="14" width="204" height="48" rx="6" fill="#6FBE86" fill-opacity=".07"/><rect x="220" y="14" width="204" height="48" rx="6" fill="none" stroke="#FFFFFF" stroke-opacity=".11"/>
      <text x="234" y="34" letter-spacing="2.4" fill="#6FBE86">A LIVE SERVICE</text><text x="234" y="51" font-size="10.5" letter-spacing=".3" fill="#798394">FastAPI · Kubernetes</text></g>
    <g class="up c3"><rect class="lamp l3" x="440" y="14" width="204" height="48" rx="6" fill="#E8B98A" fill-opacity=".07"/><rect x="440" y="14" width="204" height="48" rx="6" fill="none" stroke="#FFFFFF" stroke-opacity=".11"/>
      <text x="454" y="34" letter-spacing="2.4" fill="#E8B98A">AN NPM PACKAGE</text><text x="454" y="51" font-size="10.5" letter-spacing=".3" fill="#798394">TypeScript · MCP</text></g>
    <g class="up c4"><rect class="lamp l4" x="660" y="14" width="204" height="48" rx="6" fill="#B69BE0" fill-opacity=".07"/><rect x="660" y="14" width="204" height="48" rx="6" fill="none" stroke="#FFFFFF" stroke-opacity=".11"/>
      <text x="674" y="34" letter-spacing="2.4" fill="#B69BE0">AN ENGINE</text><text x="674" y="51" font-size="10.5" letter-spacing=".3" fill="#798394">Python · AsyncIO</text></g>
    <g class="up c5"><rect class="lamp l5" x="880" y="14" width="204" height="48" rx="6" fill="#8FBFD0" fill-opacity=".07"/><rect x="880" y="14" width="204" height="48" rx="6" fill="none" stroke="#FFFFFF" stroke-opacity=".11"/>
      <text x="894" y="34" letter-spacing="2.4" fill="#8FBFD0">A PAPER</text><text x="894" y="51" font-size="10.5" letter-spacing=".3" fill="#798394">LangChain · RAG</text></g>
  </g>
</g>
</svg>
