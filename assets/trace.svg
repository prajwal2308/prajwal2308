<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Career timeline 2023 to 2026">
<defs>
  <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3E5C7E"/><stop offset="100%" stop-color="#6E9BC9"/></linearGradient>
  <linearGradient id="b2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3F6551"/><stop offset="100%" stop-color="#6FBE86"/></linearGradient>
  <linearGradient id="b3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4A6E96"/><stop offset="100%" stop-color="#7FB2E8"/></linearGradient>
  <linearGradient id="b4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7A6340"/><stop offset="100%" stop-color="#E8B98A"/></linearGradient>
  <style>
    .mono{font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace}
    .sans{font-family:system-ui,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
    .bar{transform-origin:left center;animation:grow 1.1s cubic-bezier(.23,1,.32,1) forwards;transform:scaleX(0)}
    .g1{animation-delay:.1s}.g2{animation-delay:.28s}.g3{animation-delay:.46s}.g4{animation-delay:.64s}
    @keyframes grow{to{transform:scaleX(1)}}
    .live{animation:live 2.4s ease-in-out infinite}
    @keyframes live{0%,100%{opacity:1}50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){.bar{animation:none;transform:scaleX(1)}.live{animation:none}}
  </style>
</defs>
<rect width="1200" height="300" fill="#080B11"/>
<text class="mono" x="40" y="34" font-size="10.5" letter-spacing="3.6" fill="#5D6878">CAREER · RENDERED AS A TRACE · CONCURRENT SPANS OVERLAP</text>
<g stroke="#FFFFFF" stroke-opacity=".06">
  <line x1="300" y1="52" x2="300" y2="266"/><line x1="520" y1="52" x2="520" y2="266"/>
  <line x1="740" y1="52" x2="740" y2="266"/><line x1="960" y1="52" x2="960" y2="266"/><line x1="1160" y1="52" x2="1160" y2="266"/>
</g>
<g class="mono" font-size="9.5" fill="#4E5866">
  <text x="300" y="285" text-anchor="middle">2023</text><text x="520" y="285" text-anchor="middle">2024</text>
  <text x="740" y="285" text-anchor="middle">2025</text><text x="960" y="285" text-anchor="middle">2026</text>
</g>

<g transform="translate(0,78)">
  <text class="sans" x="40" y="4" font-size="13" font-weight="600" fill="#EDEAE4">CSG International</text>
  <text class="mono" x="40" y="20" font-size="9.5" fill="#5D6878">software developer · 18mo</text>
  <rect class="bar g1" x="300" y="-12" width="330" height="22" rx="4" fill="url(#b1)"/>
  <text class="mono" x="312" y="3" font-size="10" fill="#0A0E14" font-weight="600">Feb 2023 → Aug 2024</text>
</g>
<g transform="translate(0,132)">
  <text class="sans" x="40" y="4" font-size="13" font-weight="600" fill="#EDEAE4">Rutgers University</text>
  <text class="mono" x="40" y="20" font-size="9.5" fill="#5D6878">graduate teaching assistant · 21mo</text>
  <rect class="bar g2" x="575" y="-12" width="385" height="22" rx="4" fill="url(#b2)"/>
  <text class="mono" x="587" y="3" font-size="10" fill="#0A0E14" font-weight="600">Sept 2024 → May 2026</text>
</g>
<g transform="translate(0,186)">
  <text class="sans" x="40" y="4" font-size="13" font-weight="600" fill="#EDEAE4">Beunec Technologies</text>
  <text class="mono" x="40" y="20" font-size="9.5" fill="#5D6878">cloud &amp; systems engineer, team lead</text>
  <rect class="bar g3" x="722" y="-12" width="438" height="22" rx="4" fill="url(#b3)"/>
  <text class="mono" x="734" y="3" font-size="10" fill="#0A0E14" font-weight="600">May 2025 → active</text>
  <circle class="live" cx="1148" cy="-1" r="3.5" fill="#0A0E14"/>
</g>
<g transform="translate(0,240)">
  <text class="sans" x="40" y="4" font-size="13" font-weight="600" fill="#EDEAE4">Universal Selfcare</text>
  <text class="mono" x="40" y="20" font-size="9.5" fill="#5D6878">cloud systems engineer, project lead</text>
  <rect class="bar g4" x="852" y="-12" width="40" height="22" rx="4" fill="url(#b4)"/>
  <text class="mono" x="902" y="3" font-size="10" fill="#8B94A4">4-week contract · 95% coverage · 100% on-time</text>
</g>
</svg>
